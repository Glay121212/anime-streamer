<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Streamer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1>Anime Streamer</h1>
        <button id="settings-btn" class="settings-btn">⚙️</button>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Search movies, TV, anime..."
        autocomplete="off"
      >
      <div id="autocomplete-dropdown" class="autocomplete-dropdown hidden"></div>
      <div id="search-history" class="search-history hidden"></div>
    </section>

    <!-- Results Grid -->
    <section class="results-section">
      <div id="results-grid" class="results-grid"></div>
      <div id="no-results" class="no-results hidden">
        <p>No results found. Try a different search.</p>
      </div>
    </section>

    <!-- Season/Episode Picker Modal -->
    <div id="season-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">✕</button>
        <h2 id="modal-title"></h2>
        <div id="seasons-container" class="seasons-container"></div>
        <div id="episodes-container" class="episodes-container hidden"></div>
        <div id="picker-loading" class="loading hidden">
          <span class="spinner"></span> Loading...
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <button id="settings-close" class="modal-close">✕</button>
        <h2>Settings</h2>
        <div class="settings-group">
          <label>Preferred Player:</label>
          <select id="player-select">
            <option value="vlc">VLC</option>
            <option value="mpv">MPV</option>
          </select>
        </div>
        <div class="settings-group">
          <label>Custom Player Path:</label>
          <input type="text" id="custom-player-path" placeholder="e.g., C:\Program Files\mpv\mpv.exe">
        </div>
        <div class="settings-group">
          <button id="clear-history-btn" class="btn-secondary">Clear Search History</button>
        </div>
        <div class="settings-group">
          <button id="save-settings-btn" class="btn-primary">Save Settings</button>
        </div>
      </div>
    </div>

    <!-- Video Player Loading -->
    <div id="player-loading" class="player-loading hidden">
      <span class="spinner"></span> Loading video...
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
